
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{% block title %}PDF ToolX - PDF Tools{% endblock %}</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    /* Global Theme */
    :root {
      --bg-main: #090B10;
      --bg-navbar: #11131C;
      --bg-card: #171A24;
      --bg-hero: #11131C;

      /* Emerald Green Theme */
      --accent: #34D399;
      --accent-hover: #10B981;
      --accent-glow: rgba(52, 211, 153, 0.15);

      --text-main: #FFFFFF;
      --text-muted: #A5A9B8;
      --border-color: #292D38;
    }

    body {
      background-color: var(--bg-main);
      font-family: 'Inter', sans-serif;
      color: var(--text-main);
      min-height: 100vh;
    }

    /* Navbar */
    .navbar {
      background: var(--bg-navbar);
      padding: 0.8rem 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    .navbar-brand {
      font-weight: 700;
      color: var(--accent) !important;
      letter-spacing: -0.5px;
      font-size: 1.5rem;
    }

    .nav-link {
      color: var(--text-main) !important;
      font-weight: 500;
      transition: color 0.2s ease-in-out;
    }

    .nav-link:hover {
      color: var(--accent) !important;
    }

    .navbar.sticky-top {
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
    }

    .navbar-toggler {
      border-color: var(--border-color);
    }

    .navbar-toggler-icon {
      filter: invert(1);
    }

    /* Hero Section */
    .hero {
      padding: 5rem 1rem;
      background: linear-gradient(135deg, #11131C, #171A24);
      text-align: center;
      border: 1px solid var(--border-color);
      border-radius: 14px;
    }

    .hero h1 {
      font-weight: 700;
      font-size: 2.5rem;
      color: var(--text-main);
    }

    .hero p {
      max-width: 600px;
      margin: 0 auto;
      color: var(--text-muted);
    }

    /* Cards */
    .card {
      background-color: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      transition: all 0.25s ease-in-out;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: var(--accent);
      box-shadow: 0 8px 24px rgba(52, 211, 153, 0.12);
    }

    .card i {
      color: var(--accent);
    }

    .card p,
    .card .text-muted {
      color: var(--text-muted) !important;
    }

    /* Buttons */
    .btn-primary {
      background-color: var(--accent);
      border-color: var(--accent);
      color: #090B10;
      font-weight: 600;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
      border-color: var(--accent-hover);
      color: #090B10;
    }

    .btn-outline-primary {
      color: var(--accent);
      border-color: var(--accent);
    }

    .btn-outline-primary:hover {
      background-color: var(--accent);
      border-color: var(--accent);
      color: #090B10;
    }

    /* Links */
    a {
      transition: color 0.2s ease-in-out;
    }

    /* Form Controls */
    .form-control,
    .form-select {
      background-color: var(--bg-card);
      color: var(--text-main);
      border-color: var(--border-color);
    }

    .form-control:focus,
    .form-select:focus {
      background-color: var(--bg-card);
      color: var(--text-main);
      border-color: var(--accent);
      box-shadow: 0 0 0 0.2rem var(--accent-glow);
    }

    .form-control::placeholder {
      color: var(--text-muted);
    }

    /* Form Labels */
    label {
      color: var(--text-main);
    }

    /* Footer */
    footer {
      background: var(--bg-navbar);
      padding: 1rem;
      border-top: 1px solid var(--border-color);
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 2rem;
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">

      <a class="navbar-brand" href="{% url 'tools:index' %}">
        <i class="bi bi-file-earmark-pdf-fill me-2"
           style="color: #E53935;"></i>
        <span style="color: #34D399;">PDF ToolX</span>
      </a>

      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link fw-bold" href="{% url 'tools:index' %}">
              <i class="bi bi-house-door-fill me-1"></i> Home
            </a>
          </li>
        </ul>
      </div>

    </div>
  </nav>

  <!-- Main Content -->
  <main class="container py-5">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer>
    <p class="mb-0">© 2026 PDF ToolX — Built for productivity</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
