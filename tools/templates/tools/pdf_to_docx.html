
{% extends 'tools/base.html' %}

{% block title %}PDF to DOCX | PDF ToolX{% endblock %}

{% block content %}

<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">

    <div class="card shadow-sm border-0 rounded-3">
      <div class="card-body p-4">

        <h3 class="card-title mb-3 text-center fw-semibold text-white">
          <i class="bi bi-file-earmark-word me-2"></i>
          PDF → DOCX
        </h3>

        <p class="text-secondary text-center mb-4">
          Upload your PDF and get an editable Word document.
        </p>

        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label fw-medium text-white">
              Upload PDF
            </label>

            <input
              type="file"
              name="pdf_file"
              accept="application/pdf"
              class="form-control"
              required
            >
          </div>

          <div class="d-grid gap-2 mt-4">

            <button type="submit" class="btn btn-primary btn-lg">
              <i class="bi bi-arrow-repeat me-1"></i>
              Convert to DOCX
            </button>

            <a href="{% url 'tools:index' %}"
               class="btn btn-outline-light">
              Back to Home
            </a>

          </div>
        </form>

      </div>
    </div>

  </div>
</div>

{% endblock %}
