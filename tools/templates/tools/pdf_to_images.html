
{% extends 'tools/base.html' %}

{% block title %}PDF to Images | PDF ToolX{% endblock %}

{% block content %}

<h2 class="mb-3 text-white">PDF → Images (ZIP)</h2>

<form method="post" enctype="multipart/form-data" class="card p-4 shadow-sm">

  {% csrf_token %}

  {{ form.as_p }}

  <div class="mt-3">
    <button class="btn btn-primary" type="submit">
      <i class="bi bi-images me-1"></i> Convert to Images
    </button>

    <a class="btn btn-outline-light ms-2" href="{% url 'tools:index' %}">
      Back
    </a>
  </div>

</form>

<p class="text-secondary mt-3">
  <i class="bi bi-info-circle me-1"></i>
  Each page will be rendered to a PNG (200 DPI) and returned as a ZIP.
</p>

{% endblock %}
